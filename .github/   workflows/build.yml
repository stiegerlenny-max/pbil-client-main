
name: Build PBIL Client

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Mod
        run: gradle wrapper --gradle-version 9.2.1 && ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PBIL-Client
          path: build/libs/*.jar
